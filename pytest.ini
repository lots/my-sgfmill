[pytest]
# sgfmill_tests/run_sgfmill_testsuite.py is the authoritative test runner:
#
#     .venv\Scripts\python.exe -m sgfmill_tests.run_sgfmill_testsuite
#
# It builds cases at run time through each module's make_tests(suite) factory.
# sgfmill_tests/conftest.py teaches pytest to collect those same factories, so
# `pytest` runs the real suite with per-test reporting.
testpaths = sgfmill_tests
python_files = *_tests.py
# The modules define only base/mixin classes (Sgfmill_SimpleTestCase,
# Play_test_TestCase, ...). Cases are produced by the make_tests factories and
# collected by conftest.py, so restrict class collection to pytest's default.
python_classes = Test*
# Module-level test functions take a TestCase argument, not fixtures.
python_functions =

addopts = -p no:cacheprovider
